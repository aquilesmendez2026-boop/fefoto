<!doctype html>
<!-- `class="dark"` fija el tema oscuro de Chakra. fefoto no tiene modo claro:
     el catálogo se ve sobre pared negra y punto, así que no se deja al gusto
     del sistema operativo. -->
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description"
    content="fefoto — fotografía de autor en copias enmarcadas. Elige la obra, el papel, el tamaño, el marco y el vidrio, y la recibes lista para colgar." />
  <title>fefoto | Fotografía de autor</title>

  <!-- Vista previa al compartir el enlace (WhatsApp, Instagram, Facebook). La
       URL tiene que ser absoluta y la imagen debe existir en el dominio. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="fefoto" />
  <meta property="og:title" content="fefoto | Fotografía de autor" />
  <meta property="og:description"
    content="Copias enmarcadas de fotografía de autor. Tú eliges papel, tamaño, marco y vidrio." />
  <meta property="og:url" content="https://fefoto.cl/" />
  <meta property="og:image" content="https://fefoto.cl/og-fefoto.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="es_CL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="fefoto | Fotografía de autor" />
  <meta name="twitter:description"
    content="Copias enmarcadas de fotografía de autor. Tú eliges papel, tamaño, marco y vidrio." />
  <meta name="twitter:image" content="https://fefoto.cl/og-fefoto.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
